<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-ab9d2594eb61137a240ac3d9b68ac9f6"}, "mark": {"type": "bar"}, "encoding": {"color": {"condition": [{"test": "(datum.cantidad === 39)", "value": "purple"}], "value": "skyblue"}, "tooltip": [{"field": "release_year", "type": "quantitative"}, {"field": "cantidad", "type": "quantitative"}], "x": {"field": "release_year", "title": "A\u00f1o", "type": "ordinal"}, "y": {"field": "cantidad", "title": "Cantidad de K-Dramas", "type": "quantitative"}}, "height": 400, "title": "K-Dramas por a\u00f1o entre 2016 y 2025", "width": 600, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-ab9d2594eb61137a240ac3d9b68ac9f6": [{"release_year": 2016, "cantidad": 29}, {"release_year": 2017, "cantidad": 36}, {"release_year": 2018, "cantidad": 35}, {"release_year": 2019, "cantidad": 34}, {"release_year": 2020, "cantidad": 31}, {"release_year": 2021, "cantidad": 36}, {"release_year": 2022, "cantidad": 39}, {"release_year": 2023, "cantidad": 37}, {"release_year": 2024, "cantidad": 34}, {"release_year": 2025, "cantidad": 39}]}};
