<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@5.20.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-fdc91ba9f2716db5e4c011c4145473ce"}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "Platform", "legend": {"title": "Plataforma"}, "scale": {"domain": ["Netflix", "Viki", "Prime Video", "Disney+"], "range": ["red", "green", "lightblue", "blue"]}, "type": "nominal"}, "tooltip": [{"field": "Platform", "type": "nominal"}, {"field": "Cantidad", "type": "quantitative"}], "x": {"field": "Platform", "sort": null, "title": "Plataforma", "type": "nominal"}, "y": {"field": "Cantidad", "title": "N\u00famero de KDramas", "type": "quantitative"}}, "title": "N\u00famero de KDramas por Plataforma en el Top 100", "$schema": "https://vega.github.io/schema/vega-lite/v5.20.1.json", "datasets": {"data-fdc91ba9f2716db5e4c011c4145473ce": [{"Platform": "Netflix", "Cantidad": 60}, {"Platform": "Viki", "Cantidad": 34}, {"Platform": "Prime Video", "Cantidad": 3}, {"Platform": "Disney+", "Cantidad": 6}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
